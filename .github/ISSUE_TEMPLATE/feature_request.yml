name: Feature request
description: Suggest a behaviour for the swipe launcher
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation in the car, not the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like it to do
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Please confirm
      options:
        - label: This does not need the accessibility service to read window content — that stays off.
          required: true
        - label: This does not require reading or writing a vehicle setting — that belongs in MG4Control, and automation in MG4Tasker.
          required: true
        - label: If it needs a new Android permission, I have said which one and why.
          required: true
        - label: I have considered that the overlay sits on top of an app the driver is using.
          required: true
