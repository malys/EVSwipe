name: ✨ Feature Request
description: Suggest a new feature or enhancement to the swipe launcher
title: "[FEATURE] "
labels: [enhancement, needs-review]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        # Feature Request

        Have an idea to improve the swipe launcher? We'd love to hear it!

        **Before requesting:** Please check if a similar feature has been requested in [Discussions](https://github.com/malys/EVSwipe/discussions).

  - type: checkboxes
    id: checks
    attributes:
      label: "Pre-submission checks"
      description: "Ensure you've done these before submitting"
      options:
        - label: I've checked existing issues/discussions and found no duplicate
          required: true
        - label: This feature is for swipe overlay (not vehicle control — that's EVProfile/EVTasker)
          required: true
        - label: This does not require accessibility service to read window content
          required: true
        - label: I understand this project is not affiliated with SAIC/MG Motor
          required: false

  - type: input
    id: title
    attributes:
      label: "Feature Title"
      description: "Clear, concise name for the feature"
      placeholder: "Add gesture sensitivity slider for swipe detection"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "Problem or Use Case"
      description: |
        What problem does this solve? Why is it needed?
        - Current limitation
        - User need
        - How this improves the swipe launcher
      placeholder: |
        Users have different preferences for swipe sensitivity.
        Some want very responsive swipes; others want to avoid accidental activation.
        A sensitivity slider would let each driver tune it to their preference.
      rows: 5
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      description: |
        How should this feature work?
        - Gesture detection changes
        - Configuration storage
        - Display/control mechanism
      placeholder: |
        1. Add "Sensitivity" slider in settings (Low, Medium, High)
        2. Adjust swipe detection threshold based on setting
        3. Save preference to SharedPreferences
      rows: 6
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternative Approaches"
      description: "Have you considered other ways to solve this?"
      placeholder: |
        - Alternative 1: Auto-detect sensitivity based on usage patterns
        - Pro: no user configuration needed
        - Con: unpredictable behavior
      rows: 4

  - type: dropdown
    id: complexity
    attributes:
      label: "Estimated Complexity"
      description: "How much work is this?"
      options:
        - "Small (< 1 day)"
        - "Medium (1–3 days)"
        - "Large (1–2 weeks)"
        - "Unknown"
    validations:
      required: true

  - type: dropdown
    id: overlay_impact
    attributes:
      label: "Overlay Impact"
      description: "Does this feature affect the swipe strip overlay?"
      options:
        - "No — settings only"
        - "Yes — gesture detection changed"
        - "Yes — visual overlay affected"
        - "Unknown — unclear"
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance Criteria"
      description: "How will we know this feature is done?"
      placeholder: |
        - [ ] Settings screen shows sensitivity picker (Low/Medium/High)
        - [ ] Setting persists across app restarts
        - [ ] Swipe detection responds according to selected sensitivity
        - [ ] No false positives or missed gestures in testing
        - [ ] Works with all foreground apps without blocking them
      rows: 5

  - type: checkboxes
    id: consent
    attributes:
      label: "Consent"
      options:
        - label: I understand this project is not affiliated with SAIC/MG Motor and carries no warranty (see DISCLAIMER.md)
          required: true
