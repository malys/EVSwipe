name: 🔐 Security Vulnerability
description: Report a security vulnerability (confidential)
title: "[SECURITY] "
labels: [security, confidential]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        # Security Vulnerability Report

        **⚠️ CONFIDENTIAL:** Do not disclose vulnerability details publicly.

        Please report security issues via private GitHub Security Advisory instead:
        1. Click "Report a vulnerability" at `/security/advisories/new`
        2. Or email: [maintainer security contact]
        3. Do **not** post details in public issues

        This template is for urgent in-scope vulnerabilities only.

  - type: checkboxes
    id: checks
    attributes:
      label: "Security Classification"
      description: "Select the vulnerability type"
      options:
        - label: "Prompt injection / malicious input not validated"
        - label: "Swipe gesture hijacking (overlay captures wrong app input)"
        - label: "Overlay injection (unauthorized app draws over others)"
        - label: "Permission escalation (elevation of privilege)"
        - label: "Code execution vulnerability"
        - label: "Information disclosure (overlay reveals sensitive data)"
        - label: "Accessibility service misuse"
        - label: "Other security issue affecting overlay integrity"
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: "Vulnerability Title"
      description: "Concise title (do not include exploit details)"
      placeholder: "Overlay captures swipes intended for protected app"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Vulnerability Description"
      description: |
        High-level description (no exploit steps or proof-of-concept):
        - What is vulnerable
        - Why it matters
        - Impact on driver and vehicle
      placeholder: |
        The swipe overlay doesn't properly exclude safety-critical apps (navigation, phone).
        An attacker could overlay malicious swipes on navigation, causing wrong turn.
        Impact: Driver receives wrong navigation or misses emergency call.
      rows: 6
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: "Severity (CVSS)"
      description: "CVSS v3.1 rating"
      options:
        - "Critical (9.0–10.0) — Overlay hijacks critical apps"
        - "High (7.0–8.9) — Overlay captures sensitive input"
        - "Medium (4.0–6.9) — Moderate overlay interference"
        - "Low (0.1–3.9) — Minor issue"
    validations:
      required: true

  - type: input
    id: affected
    attributes:
      label: "Affected Versions"
      description: "Which versions are affected?"
      placeholder: "EVSwipe < 1.1.0 (all builds)"
    validations:
      required: true

  - type: textarea
    id: remediation
    attributes:
      label: "Suggested Remediation"
      description: "How should this be fixed?"
      placeholder: |
        1. Add app allowlist/blocklist for overlay exclusion
        2. Validate that overlay doesn't intercept safety-critical input
        3. Implement input filtering for navigation and phone apps
      rows: 5

  - type: checkboxes
    id: consent
    attributes:
      label: "Consent"
      options:
        - label: I understand this vulnerability will be handled according to the security policy
          required: true
        - label: I consent to coordinated disclosure and a reasonable embargo period
          required: true
