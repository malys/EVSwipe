name: Bug report
description: The swipe or the overlay misbehaves on the head unit
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security issues here — see
        [SECURITY.md](https://github.com/malys/MG4_Swipe_Launcher/blob/master/SECURITY.md)
        for private reporting.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What the app did, and what you expected instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the corner of the main screen, or the GitHub release you installed (e.g. v1.4.1).
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Channel
      options: ["stable", "unstable", "Not sure"]
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Head unit / firmware
      description: "MG4 infotainment version, e.g. SWI68. Or the emulator profile, if that is where it happened."
  - type: checkboxes
    id: permissions
    attributes:
      label: Permissions granted
      options:
        - label: Draw over other apps (overlay)
        - label: Accessibility service enabled
  - type: input
    id: foreground
    attributes:
      label: Which app was in the foreground?
      description: The swipe strips sit on top of whatever is on screen — say what that was.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Where you swiped from, how far, and what the configured strip size is.
      render: text
  - type: textarea
    id: logcat
    attributes:
      label: Logcat
      description: "If you can get it: `adb logcat -d | grep -i mg4`. A stack trace is worth ten descriptions."
      render: text
